[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-orchestrator-kernel"
version = "0.8.9"
description = "Project-driven, provider-neutral CLI orchestration with explicit approval and knowledge promotion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0,<7"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]
interop = ["mcp>=1.29,<2"]

[project.scripts]
orchestrator = "ai_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.package-data]
ai_orchestrator = ["assets/*.md"]
