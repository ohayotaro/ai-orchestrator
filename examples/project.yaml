schema_version: 1
name: user-owned-project
workflow: build-review
providers:
  reasoning:
    adapter: claude
    model: null
    priority: 20
    capabilities: [repository_analysis, planning, code_edit, test_authoring, review, supervision]
  engineering:
    adapter: codex
    model: null
    priority: 10
    capabilities: [repository_analysis, planning, code_edit, test_authoring, review, supervision]
roles:
  supervisor:
    provider: reasoning
    capabilities: [supervision, repository_analysis]
    instructions: Propose bounded tasks and ask about missing requirements.
  planner:
    provider: reasoning
    capabilities: [planning, repository_analysis]
    instructions: State assumptions and produce a bounded implementation plan.
  implementer:
    provider: engineering
    capabilities: [code_edit]
    instructions: Prefer focused changes and preserve project invariants.
  reviewer:
    provider: reasoning
    capabilities: [review, repository_analysis]
    instructions: Check acceptance criteria independently; cite concrete file evidence.
policy:
  require_execution_approval: true
  cross_provider_review: true
  protected_paths: [.env]
  max_attempts: 3
  max_agent_calls: 12
  call_timeout_seconds: 600
  task_timeout_seconds: 3600
validators:
  tests:
    argv: [.venv/bin/python, -B, -m, pytest, -q, -p, "no:cacheprovider"]
    timeout_seconds: 120
