name: Publish exact GitHub Release assets to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Approved release tag (for example v1.0.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ai-orchestrator-kernel/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download exact approved GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-assets dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern '*.whl' --pattern '*.tar.gz' \
            --pattern 'artifact-identity.json' --pattern 'release-manifest.approved.json'
      - name: Verify release identity; do not rebuild
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("release-assets")
          ident = json.loads((root / "artifact-identity.json").read_text())
          manifest = json.loads((root / "release-manifest.approved.json").read_text())
          if manifest.get("decision", {}).get("status") != "approved":
              raise SystemExit("release manifest is not owner-approved")
          if manifest.get("artifact") != ident:
              raise SystemExit("manifest/artifact identity mismatch")
          if os.environ["TAG"] != "v" + ident["package_version"]:
              raise SystemExit("tag/version mismatch")
          files = list(root.glob("*.whl")) + list(root.glob("*.tar.gz"))
          if len(files) != 2:
              raise SystemExit("expected exactly one wheel and one sdist")
          expected = {".whl": ident["wheel_sha256"], ".tar.gz": ident["sdist_sha256"]}
          for path in files:
              suffix = ".tar.gz" if path.name.endswith(".tar.gz") else ".whl"
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected[suffix]:
                  raise SystemExit(f"digest mismatch: {path.name}")
              (Path("dist") / path.name).write_bytes(path.read_bytes())
          print("Exact approved wheel/sdist staged; no build performed.")
          PY
      - name: Publish exact staged files through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
