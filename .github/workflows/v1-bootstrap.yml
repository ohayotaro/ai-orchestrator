name: V1 branch bootstrap
on:
  push:
    branches: [v1-pre-e2e-preparation]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor == 'ohayotaro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v1-pre-e2e-preparation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate exact audited inventory assets
        run: |
          test "$(git hash-object src/ai_orchestrator/contract_inventory.py)" = "585feab2d56ab03bb822ec111e2481dec23d9b6b"
          test "$(git hash-object tests/test_v1_inventory.py)" = "249dc7ace59adaf29d15cdf85ed71e5f4d6c85e1"
          python -m pip install -r requirements/rc-reference.txt
          python -m pip install --no-build-isolation -e '.[dev,interop]' -c requirements/rc-reference.txt
          python - <<'PY'
          import json
          from pathlib import Path
          from ai_orchestrator.contract_inventory import generate
          value = json.dumps(generate(), sort_keys=True, separators=(',', ':')) + '\n'
          Path('src/ai_orchestrator/assets/contracts.json').write_text(value, encoding='utf-8')
          target = Path('tests/fixtures/v1/stable-baseline.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(value, encoding='utf-8')
          PY
          echo "contracts=$(git hash-object src/ai_orchestrator/assets/contracts.json)"
          test "$(git hash-object src/ai_orchestrator/assets/contracts.json)" = "343c64f0b455b26b46dbaa06eacb52299cd52a62"
          test "$(git hash-object tests/fixtures/v1/stable-baseline.json)" = "343c64f0b455b26b46dbaa06eacb52299cd52a62"
          rm -f .github/v1-patch.* .github/ci-source.* .github/test-inventory.* .github/workflows/v1-bootstrap.yml
          git add -A
          git diff --cached --check
      - name: Commit exact pre-E2E tree
        run: |
          git config user.name "ai-orchestrator bootstrap"
          git config user.email "bootstrap@users.noreply.github.com"
          git commit -m "v0.17.2: materialize v1 pre-E2E preparation"
          git push origin HEAD:v1-pre-e2e-preparation
