name: Offline tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested source
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: tested-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,interop]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
      - run: python -m pip wheel . --no-deps -w dist
